# storeship project config for "teag.me scanner" — a managed Expo (SDK 56 / CNG) app.
# Secrets are referenced by env/path, never inlined.
#
#   storeship ship --config storeship.yml --platform ios --dry-run
#
# ── EXPO / EAS NOTE (read before building) ─────────────────────────────────────
# This repo is a *managed* Expo app: there is NO committed ios/ or android/ dir
# (Continuous Native Generation). Storeship's own build/capture stages assume a
# bare native project (xcodebuild against project_path / an XCUITest), so the
# BINARY is built outside storeship via EAS (see eas.json), and storeship is used
# for metadata + screenshots + upload. Two supported paths:
#
#   A) EAS build (recommended, no Xcode needed):
#        eas build --platform ios   --profile production   # -> .ipa
#        eas build --platform android --profile production # -> .aab
#      then hand the artifact to storeship:
#        storeship metadata    --config storeship.yml --platform ios
#        storeship screenshots --config storeship.yml --platform ios
#        storeship upload      --config storeship.yml --platform ios --artifact <App.ipa>
#
#   B) If you want storeship's xcodebuild path, first generate native projects:
#        npx expo prebuild --platform ios   # creates ios/teagmescanner.xcodeproj
#      then `storeship build`/`capture` can use ios.project_path below.
#
# Screenshots: this app has no committed XCUITest, so screenshots are produced by
# storeship's Pillow framer (oinkstash pattern). Drop raw 6.9" captures (e.g. from
# an Expo Go / dev-client run on an iPhone 17 Pro Max simulator, or `xcrun simctl
# io booted screenshot`) into store/screenshots/raw/, then:
#   storeship style --config storeship.yml \
#     --raw store/screenshots/raw --out store/screenshots/styled/en-US

name: teag.me scanner
repo: ~/developer/teag.me/apps/mobile
locales: [en-US]

ios:
  bundle_id: me.teag.scanner
  app_id: "6784932487"                  # ASC numeric app id (App Store Connect record created)
  scheme: teagmescanner                 # Expo-generated scheme after `expo prebuild` (path B only)
  project_path: ios/teagmescanner.xcworkspace  # generated by Expo+CocoaPods; unused on the EAS path
  build_settings:
    DEVELOPMENT_TEAM: L2T2KBN2GC
  devices: ["iPhone 17 Pro Max"]        # iPhone-only listing (supportsTablet=true but no iPad screenshots yet)
  metadata_dir: store/metadata/en-US
  screenshots:
    - store/screenshots/styled/en-US    # 6.9" iPhone, styled by the framer below
  asc:
    key_id: "${ASC_KEY_ID}"             # set in env / .env.local — never committed
    issuer_id: "${ASC_ISSUER_ID}"       # set in env / .env.local — never committed
    key_path: ~/.appstoreconnect/private_keys/AuthKey_52THSAQF32.p8
  copyright: "2026 teag.me"
  privacy_policy_url: https://teag.me/scanner/privacy
  app_store_review:
    contact_first_name: Michael
    contact_last_name: Teagle
    contact_email: mkteagle@gmail.com
    contact_phone: "+18018577208"
    demo_account_name: "${REVIEW_ACCOUNT_EMAIL}"
    demo_account_password: "${REVIEW_ACCOUNT_PASSWORD}"
    demo_account_required: true
    notes: >-
      Scanning works immediately without an account. To review account features,
      open History, tap Sign in, and use the demo email and password above. Scan
      a URL QR code to verify that it appears in cloud history. Wi-Fi passwords,
      plain-text QR codes, and camera images are never uploaded. To delete the
      demo account and its saved links, open History > Account and tap Delete
      account. To review the subscription, remain signed in, open Account, tap
      Upgrade to Pro, and use the sandbox purchase sheet. Restore Purchases is
      on the same screen.
  beta:
    contact_first_name: Michael
    contact_last_name: Teagle
    contact_email: mkteagle@gmail.com
    contact_phone: "+18018577208"
    demo_account_name: "${REVIEW_ACCOUNT_EMAIL}"
    demo_account_password: "${REVIEW_ACCOUNT_PASSWORD}"
    demo_account_required: true
    privacy_policy_url: https://teag.me/scanner/privacy
    marketing_url: https://teag.me/scanner
    description: >-
      Open the app, allow camera access, and point it at any QR code. Scanning
      requires no account. To test optional cloud history, open History, sign in
      with the demo credentials, and scan a URL QR code. Camera images, Wi-Fi
      credentials, and plain-text codes are never uploaded.
  what_to_test: >-
    Scan QR codes anonymously, inspect the destination before opening it, and
    scan from a saved photo. Then sign in with the review account from History
    and verify URL-only history sync. Test sign out and account deletion from
    the Account sheet.
  # App Store Server Notifications V2 URL (configure once in App Store Connect):
  # https://teag.me/api/app-store/notifications
  subscription_groups:
    - reference_name: teag.me Pro
      display_name: teag.me Pro
      products:
        - product_id: me.teag.scanner.pro.monthly
          reference_name: teag.me Pro Monthly
          period: ONE_MONTH
          price: 2.99
          name: teag.me Pro Monthly
          description: Unlimited synced URL history, 100 dynamic QR codes, and 50,000 tracked scans per month.
          group_level: 1
          family_shareable: false
          review_note: >-
            Sign in with the review account, open History > Account, and tap
            Upgrade to Pro. Purchase and Restore Purchases are shown together.
            The signed StoreKit transaction is verified by teag.me before Pro
            access is granted.

android:
  package: me.teag.scanner
  module: app
  gradle_dir: android                   # only exists after `expo prebuild --platform android`; EAS path doesn't need it
  metadata_dir: store/play/listings/en-US
  screenshots:
    - store/screenshots/styled/en-US
  play:
    # NOTE: fill in before any Play upload — Play Console access / service account TBD.
    service_account_json: ~/.config/storeship/play-teagme-scanner.json

# Optional AI marketing imagery (runs only if OPENAI_API_KEY is set).
images:
  provider: openai
  api_key_env: OPENAI_API_KEY
  # background_prompt: "deep near-black studio backdrop, soft electric-blue glow, premium, minimal, camera-first"

# AI-refresh "What's New" each ship from recent commits (gated on the Claude CLI).
metadata_ai:
  provider: claude
  fields: [release_notes]
  app_summary: >-
    teag.me scanner is a privacy-first QR code reader. It decodes camera images
    on-device and shows the full URL and domain before opening. Anonymous use is
    free; signed-in users can optionally sync URL-only history to teag.me. Wi-Fi
    passwords and plain-text codes are never saved or uploaded.
  paths: ["apps/mobile"]

# Brand palette + per-screenshot captions for the Pillow framer.
# Dark, camera-first surface: near-black canvas, electric-blue accent, off-white ink.
brand:
  paper:  "#1C1C1E"   # canvas top (scanner page bg)
  paper2: "#0A0A0A"   # canvas bottom (phone body)
  ink:    "#FFFDF8"   # headline — warm off-white
  accent: "#0F7BFF"   # eyebrow + glow — electric blue
  captions:
    01_scan.png:    { eyebrow: "Point and scan",   headline: "Read any QR code, instantly." }
    02_link.png:    { eyebrow: "See the real link", headline: "Know where it goes before you tap." }
    03_history.png: { eyebrow: "Keep useful links",  headline: "Your QR history, ready when you need it." }
    04_photo.png:   { eyebrow: "Scan from Photos",   headline: "Decode screenshots without opening the camera." }
    05_privacy.png: { eyebrow: "Private by default", headline: "Only URL history syncs when you sign in." }
